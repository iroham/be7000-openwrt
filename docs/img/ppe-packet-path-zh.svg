<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 282" width="720" height="282" role="img" aria-label="开启加速后下载数据包的去向">
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3de}.axis{stroke:#b9b8b2}
.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}
text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.t1{fill:#ffffff}.t2{fill:#c3c2b7}.grid{stroke:#34332f}.axis{stroke:#5b5a55}
.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}}
</style>
<rect class="bg" width="720" height="282" rx="12"/>
<text class="t1" x="24" y="36" font-size="18" font-weight="600">开启加速后下载数据包的去向</text>
<text class="t2" x="24" y="58" font-size="13">通过 PPPoE 下载 15 秒期间来自 WAN 的数据包占比，客户端使用 Wi-Fi</text>
<rect class="s1" x="24" y="74" width="12" height="12" rx="3"/><text class="t2" x="42" y="85" font-size="13">由 PPE 完成 NAT</text>
<rect class="s2" x="173.3" y="74" width="12" height="12" rx="3"/><text class="t2" x="191.3" y="85" font-size="13">交给处理器，无路由</text>
<rect class="s3" x="338.8" y="74" width="12" height="12" rx="3"/><text class="t2" x="356.8" y="85" font-size="13">其他</text>
<text class="t1" x="24" y="120" font-size="14">修复之前</text>
<g><title>修复之前, 交给处理器，无路由: 100.0 %</title><rect class="s2" x="24" y="128" width="671.8908913784705" height="34" rx="4"/></g>
<text x="359.94544568923527" y="150.0" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">100 %</text>
<text class="t1" x="24" y="182" font-size="14">加入 Beam WRT 修复之后</text>
<g><title>加入 Beam WRT 修复之后, 由 PPE 完成 NAT: 85.9 %</title><rect class="s1" x="24" y="190" width="575.0949813355454" height="34" rx="4"/></g>
<text x="312.5474906677727" y="212.0" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">86 %</text>
<g><title>加入 Beam WRT 修复之后, 交给处理器，无路由: 2.0 %</title><rect class="s2" x="601.0949813355454" y="190" width="11.518042306097055" height="34" rx="0"/></g>
<g><title>加入 Beam WRT 修复之后, 其他: 12.1 %</title><rect class="s3" x="614.6130236416425" y="190" width="81.38697635835747" height="34" rx="4"/></g>
<text x="655.3065118208212" y="212.0" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">12 %</text>
<text class="t2" x="24" y="260" font-size="12">依据 PPE 原因计数器（代码 93 和 162）与 wan 上的数据包数对比。</text>
</svg>