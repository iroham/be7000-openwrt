## Files and directories preserved across sysupgrade.

# Which services are enabled. OpenWrt stores that as symlinks here, and they
# are not part of the default keep list, so without this line everything the
# user enabled by hand comes back disabled after an upgrade.
/etc/rc.d/

# Says the Wi-Fi defaults were already applied on this router. Without it an
# update would look like a fresh install and set the default network again.
/etc/.miwrt_wifi_defaults
